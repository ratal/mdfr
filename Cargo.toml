[package]
name = "mdfr"
version = "0.7.3"
description = "A package for reading and writing MDF files"
authors = ["ratal <ratal@ratal.org>"]
edition = "2024"
repository = "https://github.com/ratal/mdfr/"
categories = ["encoding", "filesystem"]
license = "GPL-3.0"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["numpy", "parquet", "polars"]
# Expose pyo3's extension-module as a top-level feature so cargo test (without this flag)
# links against libpython, enabling embedded-Python tests.  maturin auto-enables this.
extension-module = ["pyo3/extension-module"]
numpy = ["dep:numpy", "dep:pyo3"]
polars = ["dep:polars", "dep:numpy", "dep:pyo3"] # numpy and pyo3 are required transitive deps for polars Python interop
parquet = ["dep:parquet"]
hdf5 = ["dep:rust-hdf5"]
ndarray = ["dep:ndarray"]

[dependencies]
clap = "4.6.6" # for input arguments
anyhow = { version = "1.0.104", features = ["backtrace"] } # error handling
log = "0.4.34" # to log events
byteorder = "1.5.0" # for bytes conversions
binrw = "0.15.2" # to efficiently read blocks
num = "0.4.3"
half = "2.7.1" # for f16 handling
encoding_rs = "0.8.35" # for endian management and bytes to text conversion (utf8, SBC, UTF16)
unicode-bom = "2.0.3"
codepage = "0.1.2" # to convert code page into encoding
chrono = "0.4.45" # for time conversion
rayon = "1.12.0" # for general purpose parallel computations
crossbeam-channel = "0.5.16" # for efficient channel between threads
parking_lot = "0.12.5" # for efficient mutex
roxmltree = "0.21.1" # for xml parsing
flate2 = "1.1.10" # for DZ block data deflate
zstd = "0.13.3"
lz4 = "1.28.1"
md-5 = "0.11.0" # md5sum of attachments
transpose = "0.2.3" # for DZBlock transpose
fasteval = "0.2.4" # for algebraic conversion
itertools = "0.15.0"
whoami = "2.1.3" # to get user name for writing file
rand = "0.10.2" # for random numbers
arrow = { version = "59.2.0", features = [
    "pyarrow",
    "prettyprint",
    "ffi",
] } # for efficient data storing in memory
arrow-csv = "59.2.0" # for efficient CSV export
env_logger = "0.11.11"
libc = "0.2.189" # for the C api
numpy = { version = "0.29.0", optional = true } # to export in numpy
polars = { version = "0.54.4", features = [
    "dtype-full",
    "object",
    "fmt",
], optional = true } # for python dataframe
parquet = { version = "59.2.0", optional = true } # to write parquet file
rust-hdf5 = { version = "0.5.1", optional = true, features = [
    "all_filters", "parallel", "threadsafe"
] } # to export into hdf5 file
ndarray = { version = "0.17.2", optional = true } # to convert arraw data into ndarray

[dependencies.pyo3]
version = "0.29.2"
features = ["num-complex", "anyhow"]
optional = true

[dev-dependencies]
criterion = "0.8.2" # for benchmark
test-log = "0.2.21"
glob = "0.3.4"
tempfile = "3.27.0"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }

[build-dependencies]
cbindgen = "0.29.4" # to generate C api headers

[lib]
name = "mdfr"
crate-type = ["rlib", "cdylib"]

[[bench]]
name = "mdf_benchmark"
harness = false

[profile.release]
opt-level = 3
debug = false
lto = true

[profile.bench]
debug = false
opt-level = 3
lto = true

[profile.dev]
debug = 2
lto = false
opt-level = 0
