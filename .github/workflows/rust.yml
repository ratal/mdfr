name: Rust tests

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test-parquet:
    name: Tests (parquet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Unzip local test fixtures
        run: cd test_files && unzip -o test_mdf3.mdf.zip && unzip -o test_mdf4.mf4.zip
      - name: Build
        run: cargo build --verbose --no-default-features --features parquet
      - name: Unit tests
        run: cargo test --lib --verbose --no-default-features --features parquet
      - name: Basic integration test
        run: cargo test --test basic --verbose --no-default-features --features parquet
      - name: Conversion unit tests
        run: cargo test --lib --verbose --no-default-features --features parquet conversions4
      - name: Embedded logger tests
        run: cargo test --test embedded_logger --verbose --no-default-features --features parquet
      - name: mdfr-core tests
        run: cargo test -p mdfr-core --all-features --verbose

  test-embedded-nostd:
    name: Check no_std embedded (Cortex-M4F)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install ARM target
        run: rustup target add thumbv7em-none-eabihf
      - name: Check mdfr-core no_std minimal
        run: cargo check -p mdfr-core --target thumbv7em-none-eabihf --no-default-features
      - name: Check mdfr-core no_std all features
        run: cargo check -p mdfr-core --target thumbv7em-none-eabihf --no-default-features --features deflate,lz4,capi-arena,defmt,derive,embedded-io,embedded-io-async
      - name: Build standalone C staticlib for Cortex-M
        run: cargo build -p mdfr-core --example mdfr_core_c --target thumbv7em-none-eabihf --no-default-features --features capi-arena

  test-polars-rust:
    name: Tests (polars Rust-native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Rust-native polars tests
        run: cargo test --test numpy_polars rust_polars --verbose --features polars

  test-polars-python:
    name: Tests (polars + numpy Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Create virtualenv and install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install polars numpy pyarrow maturin
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
      - name: Build and install Python extension
        run: maturin develop --features "polars,numpy"
      - name: Run numpy/polars tests
        run: cargo test --test numpy_polars --verbose --features "polars,numpy"
      - name: Run Python API tests
        run: python -m unittest tests/test_python_api.py
