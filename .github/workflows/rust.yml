name: Rust tests

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt-and-clippy:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy workspace all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy mdfr-core no-default-features
        run: cargo clippy -p mdfr-core --no-default-features -- -D warnings

  test-embedded-nostd:
    name: Check no_std embedded (Cortex-M4F)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install ARM target
        run: rustup target add thumbv7em-none-eabihf
      - name: Check mdfr-core no_std minimal
        run: cargo check -p mdfr-core --target thumbv7em-none-eabihf --no-default-features
      - name: Check mdfr-core no_std all features
        run: cargo check -p mdfr-core --target thumbv7em-none-eabihf --no-default-features --features deflate,lz4,capi-arena,defmt,derive,embedded-io,embedded-io-async
      - name: Build standalone C staticlib for Cortex-M
        run: cargo build -p mdfr-core --example mdfr_core_c --target thumbv7em-none-eabihf --no-default-features --features capi-arena

  test-workspace:
    name: Full Workspace Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: pip install polars numpy pyarrow
      - name: Unzip local test fixtures
        run: cd test_files && unzip -o test_mdf3.mdf.zip && unzip -o test_mdf4.mf4.zip
      - name: Run workspace tests
        run: cargo test --workspace --all-features --verbose

  test-polars-python:
    name: Tests (polars + numpy Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Create virtualenv and install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install polars numpy pyarrow maturin
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
      - name: Build and install Python extension
        run: maturin develop --features "polars,numpy"
      - name: Run numpy/polars tests
        run: cargo test --test numpy_polars --verbose --features "polars,numpy"
      - name: Run Python API tests
        run: python -m unittest tests/test_python_api.py
